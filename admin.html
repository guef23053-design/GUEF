
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GUEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f9f4 0%, #e8f5e9 100%);
            min-height: 100vh;
        }
        .admin-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .admin-header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .admin-header h1 { color: #1b4332; font-size: 1.6rem; }
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .stat-number { font-size: 2.2rem; font-weight: 700; color: #2d6a4f; }
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th, .user-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .user-table th { background: #f8f9fa; color: #1b4332; }
        .badge {
            background: #2d6a4f;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .badge.admin { background: #f39c12; }
        button.small {
            padding: 5px 12px;
            background: #2d6a4f;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 50px; }
        @media (max-width: 768px) {
            .user-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><i class="fas fa-users fa-2x" style="color:#2d6a4f"></i><div class="stat-number" id="totalUsers">—</div><div>Total Users</div></div>
        <div class="stat-card"><i class="fas fa-seedling fa-2x" style="color:#2d6a4f"></i><div class="stat-number" id="totalProjects">—</div><div>Projects</div></div>
        <div class="stat-card"><i class="fas fa-map-marker-alt fa-2x" style="color:#2d6a4f"></i><div class="stat-number" id="totalCounties">—</div><div>Counties</div></div>
    </div>

    <div class="admin-card">
        <h2><i class="fas fa-users"></i> Manage Users</h2>
        <div style="overflow-x: auto;">
            <table class="user-table" id="userTable">
                <thead>
                    <tr><th>Name</th><th>Email</th><th>County</th><th>Role</th><th>Action</th></tr>
                </thead>
                <tbody id="userTableBody"><tr><td colspan="5" class="loading">Loading users...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://itcogcebxavnrcfymfxc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0Y29nY2VieGF2bnJjZnltZnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTgzNjAsImV4cCI6MjA5NjU5NDM2MH0.x7m4wk9H5RtLpBqLTJraASXa22XlwwlDo_LamFwLgok';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const session = localStorage.getItem('guef_session') || sessionStorage.getItem('guef_session');
    if (!session) { window.location.href = 'login.html'; }

    let currentUser;
    try { currentUser = JSON.parse(session); }
    catch(e) { window.location.href = 'login.html'; }

    // Double‑check admin role from DB
    async function verifyAndLoad() {
        const { data, error } = await supabase
            .from('users')
            .select('role')
            .eq('id', currentUser.user_id)
            .single();
        if (error || data?.role !== 'admin') {
            window.location.href = 'dashboard.html';  // not admin, go back
        } else {
            loadStats();
            loadUsers();
        }
    }

    async function loadStats() {
        const { count: usersCount } = await supabase.from('users').select('*', { count: 'exact', head: true });
        const { count: projectsCount } = await supabase.from('projects').select('*', { count: 'exact', head: true });
        const { data: countiesData } = await supabase.from('users').select('county').not('county', 'is', null);
        const uniqueCounties = countiesData ? new Set(countiesData.map(c => c.county)).size : 0;
        document.getElementById('totalUsers').innerText = (usersCount || 0).toLocaleString();
        document.getElementById('totalProjects').innerText = (projectsCount || 0);
        document.getElementById('totalCounties').innerText = uniqueCounties;
    }

    async function loadUsers() {
        const { data: users, error } = await supabase
            .from('users')
            .select('id, full_name, email, county, role')
            .order('created_at', { ascending: false });

        if (error) {
            document.getElementById('userTableBody').innerHTML = '<tr><td colspan="5">Error loading users</td></tr>';
            return;
        }

        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        for (const user of users) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(user.full_name || '—')}</td>
                <td>${escapeHtml(user.email)}</td>
                <td>${escapeHtml(user.county || '—')}</td>
                <td><span class="badge ${user.role === 'admin' ? 'admin' : ''}">${escapeHtml(user.role)}</span></td>
                <td>
                    <button class="small" onclick="toggleRole('${user.id}', '${user.role}')">
                        ${user.role === 'admin' ? 'Remove admin' : 'Make admin'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    window.toggleRole = async (userId, currentRole) => {
        const newRole = currentRole === 'admin' ? 'user' : 'admin';
        const { error } = await supabase.from('users').update({ role: newRole }).eq('id', userId);
        if (error) {
            alert('Error updating role');
        } else {
            loadUsers();  // refresh list
        }
    };

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function logout() {
        localStorage.removeItem('guef_session');
        sessionStorage.removeItem('guef_session');
        window.location.href = 'login.html';
    }

    verifyAndLoad();
</script>
</body>
</html>
