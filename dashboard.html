<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#2d6a4f">
    <title>GUEF Nexus — Modern Dashboard</title>
    
    <!-- Google Font + Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Chart.js & Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #40916c;
            --accent: #52b788;
            --secondary: #95d5b2;
            --light-bg: #f8fef9;
            --dark-bg: #0f1f17;
            --white: #ffffff;
            --gray-100: #f1f5f9;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 20px 25px -12px rgba(0, 0, 0, 0.08);
            --radius-xl: 1.5rem;
            --radius-lg: 1rem;
            --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-bg);
            color: #1e2a2a;
            transition: background 0.2s ease;
        }

        /* Dark mode override (modern) */
        @media (prefers-color-scheme: dark) {
            :root {
                --light-bg: #0a120e;
                --white: #1a2a22;
                --gray-100: #1e2f26;
                --gray-300: #2d3f35;
                --gray-600: #b9d2c4;
            }
            body { color: #e2f0ea; }
            .stat-card, .analytics-card, .profile-card, .activity-card, .quick-actions, .group-card-modern {
                background: rgba(30, 45, 38, 0.8);
                backdrop-filter: blur(2px);
                border: 1px solid rgba(82, 183, 136, 0.2);
            }
        }

        /* Layout */
        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Glass Evolution */
        .sidebar {
            width: 280px;
            background: linear-gradient(145deg, var(--primary-dark) 0%, #1a4731 100%);
            backdrop-filter: blur(0px);
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 12px 0 30px rgba(0, 0, 0, 0.2);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar-header {
            padding: 32px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .sidebar-logo {
            width: 84px;
            height: 84px;
            border-radius: 28px;
            background: white;
            object-fit: cover;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
            border: 3px solid rgba(255,215,150,0.6);
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            margin: 4px 12px;
            border-radius: 14px;
            transition: var(--transition);
            cursor: pointer;
            font-weight: 500;
        }
        .menu-item.active, .menu-item:hover {
            background: rgba(255,255,240,0.18);
            transform: translateX(6px);
            backdrop-filter: blur(10px);
        }

        /* Main area */
        .main-content {
            flex: 1;
            margin-left: 280px;
        }
        .top-header {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(82,183,136,0.2);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .content-wrapper {
            padding: 28px 32px;
        }

        /* Modern Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 24px;
            margin-bottom: 36px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1px solid rgba(45,106,79,0.1);
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .stat-number {
            font-size: 2.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* group images gallery - MODERN GRID */
        .group-gallery-section {
            margin: 48px 0 32px;
        }
        .gallery-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .gallery-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, var(--primary-dark), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }
        .group-card-modern {
            background: var(--white);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.35s ease;
            box-shadow: 0 12px 22px -12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(82,183,136,0.2);
        }
        .group-card-modern:hover {
            transform: scale(1.02) translateY(-6px);
            box-shadow: 0 25px 35px -12px rgba(45,106,79,0.25);
        }
        .group-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 220px;
        }
        .group-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .group-card-modern:hover .group-img-wrapper img {
            transform: scale(1.05);
        }
        .group-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent);
            padding: 16px;
            color: white;
            transform: translateY(100%);
            transition: 0.3s;
        }
        .group-card-modern:hover .group-overlay {
            transform: translateY(0);
        }
        .group-info {
            padding: 18px 16px 20px;
        }
        .group-name {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 6px;
            color: var(--primary-dark);
        }
        .group-location {
            font-size: 0.8rem;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Lightbox Modern */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox-content {
            max-width: 85vw;
            max-height: 85vh;
            background: transparent;
            border-radius: 32px;
            overflow: hidden;
            animation: floatIn 0.25s ease;
        }
        .lightbox-content img {
            width: auto;
            max-width: 100%;
            max-height: 80vh;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .lightbox-caption {
            text-align: center;
            margin-top: 18px;
            color: white;
            font-weight: 500;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* misc enhancements */
        .action-btn {
            background: rgba(45,106,79,0.08);
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 600;
            transition: 0.2s;
        }
        .action-btn.primary {
            background: var(--primary);
            color: white;
        }
        .analytics-card, .profile-card, .activity-card {
            border-radius: 28px;
            background: var(--white);
            transition: var(--transition);
        }
        .welcome-card {
            background: radial-gradient(circle at 10% 20%, var(--primary), var(--primary-dark));
            border-radius: 32px;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .sidebar.active { transform: translateX(0); }
            .mobile-menu-toggle { display: block; }
            .content-wrapper { padding: 20px; }
            .group-grid { grid-template-columns: 1fr; }
        }
        .mobile-menu-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--primary); }
        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 11000;
            background: white;
            border-radius: 60px;
            padding: 12px 24px;
            box-shadow: var(--shadow-md);
            border-left: 5px solid var(--primary);
        }
        .edit-profile-btn {
            background: var(--primary-light);
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            transition: 0.2s;
        }
        .modal-content {
            background: var(--white);
            border-radius: 32px;
        }
        .dashboard-footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="logo.jpg" alt="GUEF" class="sidebar-logo" onerror="this.src='https://placehold.co/200x200/2d6a4f/ffffff?text=GUEF'">
            <h3>Great United Eastern</h3>
            <p>Foundations</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-section"><div class="menu-section-title">Main</div>
                <a href="#" class="menu-item active" data-page="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="#" class="menu-item" data-page="profile"><i class="fas fa-user"></i><span>My Profile</span></a>
                <a href="#" class="menu-item" data-page="analytics"><i class="fas fa-chart-line"></i><span>Analytics</span></a>
                <a href="#" class="menu-item" data-page="projects"><i class="fas fa-seedling"></i><span>My Projects</span><span class="badge" id="projectBadge">0</span></a>
            </div>
            <div class="menu-section"><div class="menu-section-title">Community</div>
                <a href="#" class="menu-item" data-page="events"><i class="fas fa-calendar-alt"></i><span>Events</span></a>
                <a href="#" class="menu-item" data-page="forum"><i class="fas fa-comments"></i><span>Forum</span></a>
                <a href="#" class="menu-item" data-page="resources"><i class="fas fa-book"></i><span>Resources</span></a>
            </div>
            <div class="menu-section"><div class="menu-section-title">Settings</div>

                <a href="#" class="menu-item" onclick="window.openChangePasswordModal?.()"><i class="fas fa-key"></i><span>Change Password</span></a>

                <a href="#" class="menu-item" onclick="window.logout?.()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>

    <div class="main-content">
        <header class="top-header">
            <div class="header-left"><button class="mobile-menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button><h2 class="page-title" id="pageTitle">Dashboard</h2></div>
            <div class="header-right">
                <div class="search-bar" style="display: flex; align-items: center; gap: 8px; background: var(--gray-100); padding: 8px 16px; border-radius: 48px;"><i class="fas fa-search"></i><input type="text" placeholder="Search groups..." id="globalSearch" style="background: none; border: none; outline: none;"></div>
                <div class="notification-bell" style="position: relative;"><i class="far fa-bell"></i><span class="notification-badge" id="notificationBadge">0</span><div class="notification-dropdown" style="display: none;"></div></div>
                <div class="user-profile" style="display: flex; gap: 12px; align-items: center;"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">User</div><div class="user-role" id="userRole">Member</div></div></div>
            </div>
        </header>
        <main class="content-wrapper" id="mainContent"></main>
        <footer class="dashboard-footer"><p>© <span id="currentYear"></span> Great United Eastern Foundations · United for Tomorrow</p></footer>
    </div>
</div>

<!-- Lightbox Modal for Group Images -->
<div id="groupLightbox" class="lightbox-modal" style="display: none;">
    <div style="position: relative; text-align: center;">
        <div class="lightbox-content"><img id="lightboxImg" src="" alt="group preview"></div>
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button onclick="closeLightbox()" style="position: absolute; top: 10px; right: 20px; background: white; border: none; border-radius: 50%; width: 40px; cursor: pointer;">✕</button>
    </div>
</div>

<!-- Modals (profile / password) -->
<div class="modal" id="editProfileModal"><div class="modal-content"><h3>Edit Profile</h3><form id="editProfileForm"><input type="text" id="editFullName" placeholder="Full Name"><input type="email" id="editEmail" placeholder="Email"><input type="tel" id="editPhone" placeholder="Phone"><input type="text" id="editCounty" placeholder="County"><input type="text" id="editGroupName" placeholder="Group Name"><button type="submit">Save</button><button type="button" onclick="closeEditProfileModal()">Cancel</button></form></div></div>
<div class="modal" id="changePasswordModal"><div class="modal-content"><h3>Change Password</h3><form id="changePasswordForm"><input type="password" id="currentPassword" placeholder="Current"><input type="password" id="newPassword" placeholder="New"><input type="password" id="confirmPassword" placeholder="Confirm"><button type="submit">Update</button><button type="button" onclick="closeChangePasswordModal()">Cancel</button></form></div></div>

<script>
    (function(){
        const SUPABASE_URL = 'https://itcogcebxavnrcfymfxc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0Y29nY2VieGF2bnJjZnltZnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTgzNjAsImV4cCI6MjA5NjU5NDM2MH0.x7m4wk9H5RtLpBqLTJraASXa22XlwwlDo_LamFwLgok';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const sessionData = localStorage.getItem('guef_session') || sessionStorage.getItem('guef_session');
        if (!sessionData) { window.location.href = 'login.html'; return; }
        let currentUser = JSON.parse(sessionData);
        
        // ---------- 🌟 GROUP IMAGES (MODERN GALLERY) ----------
        // User-provided group images: update these URLs with your actual group images
        const GROUP_IMAGES_LIST = [
            { id: 1, url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&h=400&fit=crop", title: "Agri-Tech Innovators", location: "Machakos County", members: 48 },
            { id: 2, url: "https://images.unsplash.com/photo-1557804506-669a67965ba0?w=600&h=400&fit=crop", title: "Green Warriors", location: "Embu", members: 62 },
            { id: 3, url: "https://images.unsplash.com/photo-1573164574572-cb89e3989b6a?w=600&h=400&fit=crop", title: "Youth in Agribusiness", location: "Meru", members: 33 },
            { id: 4, url: "https://images.unsplash.com/photo-1543269865-cbf427effbad?w=600&h=400&fit=crop", title: "Women Empowerment Circle", location: "Tharaka Nithi", members: 51 },
            { id: 5, url: "https://images.unsplash.com/photo-1600880292203-757bb62b4b92?w=600&h=400&fit=crop", title: "Water & Sanitation Taskforce", location: "Kitui", members: 27 },
            { id: 6, url: "https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=600&h=400&fit=crop", title: "Climate Resilience Hub", location: "Isiolo", members: 44 }
        ];
        
        function renderGroupGallery() {
            const container = document.getElementById('groupGalleryContainer');
            if (!container) return;
            let html = `<div class="group-gallery-section"><div class="gallery-header"><div class="gallery-title"><i class="fas fa-images" style="color: var(--primary);"></i> Community Group Images</div><span style="font-size:0.85rem;">${GROUP_IMAGES_LIST.length} active groups</span></div><div class="group-grid" id="dynamicGroupGrid"></div></div>`;
            container.innerHTML = html;
            const gridContainer = document.getElementById('dynamicGroupGrid');
            if (!gridContainer) return;
            gridContainer.innerHTML = GROUP_IMAGES_LIST.map(group => `
                <div class="group-card-modern" data-group='${JSON.stringify(group)}'>
                    <div class="group-img-wrapper">
                        <img src="${group.url}" alt="${group.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400/2d6a4f/white?text=Group+Image'">
                        <div class="group-overlay"><i class="fas fa-users"></i> ${group.members} members</div>
                    </div>
                    <div class="group-info">
                        <div class="group-name">${escapeHtml(group.title)}</div>
                        <div class="group-location"><i class="fas fa-map-pin"></i> ${escapeHtml(group.location)}</div>
                    </div>
                </div>
            `).join('');
            // attach lightbox events
            document.querySelectorAll('.group-card-modern').forEach(card => {
                card.addEventListener('click', (e) => {
                    const groupData = JSON.parse(card.getAttribute('data-group'));
                    openLightbox(groupData.url, groupData.title + " · " + groupData.location);
                });
            });
        }
        
        function openLightbox(imgUrl, caption) {
            const lb = document.getElementById('groupLightbox');
            const imgElem = document.getElementById('lightboxImg');
            const capElem = document.getElementById('lightboxCaption');
            imgElem.src = imgUrl;
            capElem.innerText = caption;
            lb.style.display = 'flex';
        }
        window.closeLightbox = function() { document.getElementById('groupLightbox').style.display = 'none'; };
        
        // Dashboard content that includes Group Gallery placeholder
        function renderDashboard() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="welcome-card" style="padding: 32px;"><h1>Welcome Back, <span id="welcomeName">${escapeHtml(currentUser.full_name || currentUser.username)}</span> 🌿</h1><p>Transforming eastern communities through sustainable action & collaboration.</p></div>
                <div class="stats-grid"><div class="stat-card"><div class="stat-icon">🌱</div><div class="stat-number" id="statProjects">--</div><div>Active Projects</div></div><div class="stat-card"><div class="stat-icon">👥</div><div class="stat-number" id="statUsers">--</div><div>Members</div></div><div class="stat-card"><div class="stat-icon">📋</div><div class="stat-number" id="statApplications">--</div><div>Applications</div></div><div class="stat-card"><div class="stat-icon">🏞️</div><div class="stat-number" id="statCounties">--</div><div>Counties</div></div></div>
                <div class="analytics-section" style="display: grid; gap: 24px; grid-template-columns: 1fr 1fr; margin-bottom: 32px;"><div class="analytics-card"><h3><i class="fas fa-chart-line"></i> Registrations</h3><canvas id="activityChart" height="180"></canvas></div><div class="analytics-card"><h3><i class="fas fa-chart-pie"></i> Project Categories</h3><canvas id="projectsChart" height="180"></canvas></div></div>
                <div class="dashboard-grid" style="display: grid; gap: 28px; grid-template-columns: 1fr 1fr; margin-bottom: 40px;"><div class="profile-card"><div class="profile-header" style="background: var(--primary); padding: 24px; text-align:center;"><div class="profile-avatar" style="background: white; border-radius: 100px; width: 80px; margin:auto;"><span>${(currentUser.full_name || currentUser.username).charAt(0)}</span></div><h3 style="margin-top: 12px;">${escapeHtml(currentUser.full_name || currentUser.username)}</h3><p>${currentUser.role === 'admin' ? 'Administrator' : 'Community Member'}</p></div><div class="profile-body" style="padding: 20px;"><div><i class="fas fa-envelope"></i> ${escapeHtml(currentUser.email)}</div><div><i class="fas fa-phone"></i> ${escapeHtml(currentUser.phone || 'N/A')}</div><div><i class="fas fa-map-marker-alt"></i> ${escapeHtml(currentUser.county || 'Eastern')}</div><button class="edit-profile-btn" style="margin-top: 16px;" onclick="openEditProfileModal()">Edit Profile</button></div></div>
                <div class="activity-card"><h3><i class="fas fa-history"></i> Recent Activity</h3><ul class="activity-list" id="activityList"><li>Loading updates...</li></ul></div></div>
                <div class="quick-actions" style="margin-bottom: 24px;"><h3>⚡ Quick Actions</h3><div class="action-buttons"><button class="action-btn primary" onclick="window.location.href='programs.html'"><i class="fas fa-seedling"></i> Programs</button><button class="action-btn" onclick="openEditProfileModal()">Update Profile</button><button class="action-btn" onclick="showResources()">Resources</button></div></div>
                <div id="groupGalleryContainer"></div>
            `;
            setTimeout(() => {
                loadStats();
                loadActivities();
                initCharts();
                renderGroupGallery();  // 🌟 GROUP IMAGES APPEAR HERE
            }, 20);
        }
        
        async function loadStats() {
            try {
                const { count: users } = await supabase.from('users').select('*', { count: 'exact', head: true });
                const { count: projects } = await supabase.from('projects').select('*', { count: 'exact', head: true });
                const { count: apps } = await supabase.from('applications').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.user_id);
                const { data: countiesRaw } = await supabase.from('users').select('county');
                const uniqueCounties = [...new Set(countiesRaw?.map(c=>c.county).filter(Boolean))].length;
                document.getElementById('statProjects') && (document.getElementById('statProjects').innerText = (projects || 0) + '+');
                document.getElementById('statUsers') && (document.getElementById('statUsers').innerText = (users || 0).toLocaleString());
                document.getElementById('statApplications') && (document.getElementById('statApplications').innerText = apps || 0);
                document.getElementById('statCounties') && (document.getElementById('statCounties').innerText = uniqueCounties);
                document.getElementById('projectBadge') && (document.getElementById('projectBadge').innerText = projects || 0);
            } catch(e) { console.warn(e); }
        }
        async function loadActivities() {
            const { data } = await supabase.from('users').select('full_name, county, created_at').order('created_at', { ascending: false }).limit(5);
            const actList = document.getElementById('activityList');
            if(actList && data) actList.innerHTML = data.map(u => `<li style="display: flex; gap: 12px; padding: 12px 0;"><i class="fas fa-user-plus"></i> <strong>${escapeHtml(u.full_name)}</strong> joined from ${escapeHtml(u.county || 'Eastern')}<span style="margin-left:auto; font-size:0.7rem;">${new Date(u.created_at).toLocaleDateString()}</span></li>`).join('');
        }
        let activityChart, projectsChart;
        async function initCharts() {
            const { data: users } = await supabase.from('users').select('created_at');
            if(users && document.getElementById('activityChart')) {
                const monthly = {};
                users.forEach(u => { if(u.created_at) { let d = new Date(u.created_at); let key = `${d.getFullYear()}-${d.getMonth()+1}`; monthly[key] = (monthly[key]||0)+1; } });
                const labels = Object.keys(monthly).sort().map(k => { let [y,m]=k.split('-'); return new Date(y,m-1).toLocaleDateString(undefined,{month:'short'}) });
                const ctx = document.getElementById('activityChart').getContext('2d');
                if(activityChart) activityChart.destroy();
                activityChart = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'New Members', data: Object.values(monthly), borderColor: '#2d6a4f', tension: 0.3, fill: true, backgroundColor: 'rgba(45,106,79,0.1)' }] }, options: { responsive: true, maintainAspectRatio: true } });
            }
            const { data: proj } = await supabase.from('projects').select('category');
            if(proj && document.getElementById('projectsChart')) {
                let cats = {};
                proj.forEach(p => { if(p.category) cats[p.category] = (cats[p.category]||0)+1; });
                const ctx2 = document.getElementById('projectsChart').getContext('2d');
                if(projectsChart) projectsChart.destroy();
                projectsChart = new Chart(ctx2, { type: 'doughnut', data: { labels: Object.keys(cats), datasets: [{ data: Object.values(cats), backgroundColor: ['#2d6a4f','#40916c','#52b788','#74c69d','#95d5b2'] }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } });
            }
        }
        
        // profile update handlers
        async function updateProfile(e) {
            e.preventDefault();
            const payload = { full_name: document.getElementById('editFullName').value, email: document.getElementById('editEmail').value, phone: document.getElementById('editPhone').value, county: document.getElementById('editCounty').value, group_name: document.getElementById('editGroupName').value };
            await supabase.from('users').update(payload).eq('id', currentUser.user_id);
            Object.assign(currentUser, payload);
            localStorage.setItem('guef_session', JSON.stringify(currentUser));
            closeEditProfileModal(); renderDashboard(); showToast("Profile updated", "success");
        }
        async function changePasswordHandler(e) {
            e.preventDefault(); const cur = document.getElementById('currentPassword').value, newp = document.getElementById('newPassword').value, conf = document.getElementById('confirmPassword').value;
            if(newp !== conf) return showToast("Passwords mismatch","error");
            const enc = async (pwd) => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd)))).map(b=>b.toString(16).padStart(2,'0')).join('');
            const curHash = await enc(cur);
            if(currentUser.password !== curHash) return showToast("Current password wrong","error");
            const newHash = await enc(newp);
            await supabase.from('users').update({ password: newHash }).eq('id', currentUser.user_id);
            showToast("Password changed","success"); closeChangePasswordModal();
        }
        window.openEditProfileModal = () => { let modal = document.getElementById('editProfileModal'); modal.style.display = 'flex'; document.getElementById('editFullName').value = currentUser.full_name || ''; document.getElementById('editEmail').value = currentUser.email || ''; document.getElementById('editPhone').value = currentUser.phone || ''; document.getElementById('editCounty').value = currentUser.county || ''; document.getElementById('editGroupName').value = currentUser.group_name || ''; };
        window.closeEditProfileModal = () => document.getElementById('editProfileModal').style.display = 'none';
        window.openChangePasswordModal = () => document.getElementById('changePasswordModal').style.display = 'flex';
        window.closeChangePasswordModal = () => document.getElementById('changePasswordModal').style.display = 'none';
        window.logout = () => { localStorage.clear(); sessionStorage.clear(); window.location.href = 'login.html'; };
        function showToast(msg, type) { let t = document.createElement('div'); t.className = `toast-notification`; t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        window.showResources = () => showToast("Resource hub coming soon", "info");
        function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        
        // event listeners & menu
        document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('active'));
        document.querySelectorAll('.menu-item[data-page]').forEach(el => el.addEventListener('click',(e)=>{
            e.preventDefault(); let page = el.dataset.page;
            document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active')); el.classList.add('active');
            if(page === 'dashboard') { document.getElementById('pageTitle').innerText = 'Dashboard'; renderDashboard(); }
            else if(page === 'profile') { document.getElementById('pageTitle').innerText = 'My Profile'; document.getElementById('mainContent').innerHTML = `<div class="profile-card" style="max-width:600px; margin:auto;"><div class="profile-header"><div class="profile-avatar"><span>${(currentUser.full_name || currentUser.username).charAt(0)}</span></div><h3>${escapeHtml(currentUser.full_name)}</h3></div><div class="profile-body"><p><i class="fas fa-envelope"></i> ${escapeHtml(currentUser.email)}</p><p><i class="fas fa-phone"></i> ${escapeHtml(currentUser.phone||'N/A')}</p><button onclick="openEditProfileModal()" class="edit-profile-btn">Edit profile</button><button onclick="openChangePasswordModal()" style="margin-top:12px;">Change Password</button></div></div>`; }
            else showToast(`✨ ${page} module is under development`, "info");
        }));
        document.getElementById('editProfileForm').addEventListener('submit', updateProfile);
        document.getElementById('changePasswordForm').addEventListener('submit', changePasswordHandler);
        document.getElementById('currentYear').innerText = new Date().getFullYear();
        document.getElementById('userName').innerText = currentUser.username;
        document.getElementById('userAvatar').innerText = (currentUser.full_name || currentUser.username).charAt(0).toUpperCase();
        document.getElementById('userRole').innerText = currentUser.role === 'admin' ? 'Admin' : 'Member';
        if(currentUser.role === 'admin') document.getElementById('adminPanelLink').style.display = 'flex';
        renderDashboard();
        window.addEventListener('click', (e) => { if(e.target === document.getElementById('groupLightbox')) closeLightbox(); if(e.target === document.getElementById('editProfileModal')) closeEditProfileModal(); if(e.target === document.getElementById('changePasswordModal')) closeChangePasswordModal(); });
    })();
</script>
</body>
</html>
