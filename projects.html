<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects - GUEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (same styles as above) */
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f9f4 0%, #e8f5e9 100%);
            padding: 30px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #1b4332; font-size: 1.8rem; }
        .btn {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #2d6a4f;
            color: #2d6a4f;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .tab.active {
            color: #2d6a4f;
            border-bottom: 3px solid #2d6a4f;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .project-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .project-card:hover { transform: translateY(-5px); }
        .project-image {
            height: 180px;
            background-size: cover;
            background-position: center;
        }
        .project-content { padding: 20px; }
        .project-title { font-size: 1.2rem; font-weight: 600; color: #1b4332; margin-bottom: 8px; }
        .project-category {
            display: inline-block;
            background: #e8f5e9;
            color: #2d6a4f;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }
        .project-desc { color: #5a7a6a; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.5; }
        .project-meta { font-size: 0.8rem; color: gray; margin-bottom: 15px; display: flex; gap: 15px; }
        .apply-btn {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
        }
        .apply-btn:disabled { background: #9cb8ab; cursor: not-allowed; }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 30px;
            background: #f39c12;
            color: white;
            display: inline-block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2d6a4f;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-seedling"></i> Our Projects</h1>
        <a href="dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="available">📋 Available Projects</div>
        <div class="tab" data-tab="my">📌 My Applications</div>
    </div>

    <div id="availableTab">
        <div class="projects-grid" id="projectsList"></div>
    </div>
    <div id="myTab" style="display:none;">
        <div class="projects-grid" id="myProjectsList"></div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        const SUPABASE_URL = 'https://itcogcebxavnrcfymfxc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0Y29nY2VieGF2bnJjZnltZnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTgzNjAsImV4cCI6MjA5NjU5NDM2MH0.x7m4wk9H5RtLpBqLTJraASXa22XlwwlDo_LamFwLgok';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Session check
        const session = localStorage.getItem('guef_session') || sessionStorage.getItem('guef_session');
        let currentUser = null;
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        try {
            currentUser = JSON.parse(session);
        } catch(e) {
            window.location.href = 'login.html';
            return;
        }

        async function loadProjects() {
            const { data: projects, error } = await supabaseClient
                .from('projects')
                .select('*')
                .eq('status', 'active')
                .order('start_date', { ascending: true });
            if (error) {
                console.error(error);
                return;
            }
            const container = document.getElementById('projectsList');
            container.innerHTML = '';
            for (const p of projects) {
                const { data: applied } = await supabaseClient
                    .from('project_applications')
                    .select('id')
                    .eq('project_id', p.id)
                    .eq('user_id', currentUser.user_id)
                    .maybeSingle();
                const alreadyApplied = !!applied;
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-image" style="background-image:url('${p.image_url || 'default.jpg'}'); background-size:cover;"></div>
                    <div class="project-content">
                        <div class="project-category">${escapeHtml(p.category || 'General')}</div>
                        <div class="project-title">${escapeHtml(p.title)}</div>
                        <div class="project-desc">${escapeHtml(p.description?.substring(0, 120))}...</div>
                        <div class="project-meta"><i class="far fa-calendar-alt"></i> ${formatDate(p.start_date)} - ${formatDate(p.end_date)}</div>
                        <button class="apply-btn" data-id="${p.id}" ${alreadyApplied ? 'disabled' : ''}>
                            ${alreadyApplied ? '✓ Applied' : 'Apply Now'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
                if (!alreadyApplied) {
                    card.querySelector('.apply-btn').addEventListener('click', () => applyForProject(p.id));
                }
            }
        }

        async function loadMyApplications() {
            const { data: apps, error } = await supabaseClient
                .from('project_applications')
                .select('project_id, status, applied_at, projects(*)')
                .eq('user_id', currentUser.user_id);
            if (error) return;
            const container = document.getElementById('myProjectsList');
            container.innerHTML = '';
            if (!apps || apps.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;">You have not applied to any project yet.</div>';
                return;
            }
            for (const app of apps) {
                const project = app.projects;
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-image" style="background-image:url('${project.image_url || 'default.jpg'}'); background-size:cover;"></div>
                    <div class="project-content">
                        <div class="project-category">${escapeHtml(project.category || 'General')}</div>
                        <div class="project-title">${escapeHtml(project.title)}</div>
                        <div class="project-desc">${escapeHtml(project.description?.substring(0, 120))}...</div>
                        <div class="project-meta">Applied: ${new Date(app.applied_at).toLocaleDateString()}</div>
                        <span class="status-badge">${escapeHtml(app.status)}</span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        async function applyForProject(projectId) {
            const { error } = await supabaseClient
                .from('project_applications')
                .insert({ project_id: projectId, user_id: currentUser.user_id, status: 'pending' });
            if (error) {
                showToast('Error applying: ' + error.message, 'error');
            } else {
                showToast('Application submitted!', 'success');
                loadProjects();
                // If currently on "My Applications" tab, reload it
                if (document.querySelector('.tab.active').innerText.includes('My')) {
                    loadMyApplications();
                }
            }
        }

        function formatDate(dateStr) { if(!dateStr) return 'TBD'; return new Date(dateStr).toLocaleDateString(); }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function showToast(msg, type) { 
            const t=document.createElement('div'); 
            t.className='toast'; 
            t.innerText=msg; 
            document.body.appendChild(t); 
            setTimeout(()=>t.remove(),2500); 
        }

        // Tab switching
        const tabs = document.querySelectorAll('.tab');
        const availableDiv = document.getElementById('availableTab');
        const myDiv = document.getElementById('myTab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (tab.innerText.includes('Available')) {
                    availableDiv.style.display = 'block';
                    myDiv.style.display = 'none';
                    loadProjects();
                } else {
                    availableDiv.style.display = 'none';
                    myDiv.style.display = 'block';
                    loadMyApplications();
                }
            });
        });

        loadProjects();
    })();
</script>
</body>
</html>
